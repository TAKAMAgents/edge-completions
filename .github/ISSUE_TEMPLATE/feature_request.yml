name: Feature request
description: Propose a focused provider-boundary capability.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What typed application behavior is currently blocked?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed contract
      description: Describe the provider contract, invariant, and compatibility impact.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Provider evidence
      description: Link authoritative documentation without pasting raw private payloads.
