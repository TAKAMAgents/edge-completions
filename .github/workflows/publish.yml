name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify the immutable release boundary
        shell: bash
        run: |
          manifest_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "v${manifest_version}" = "${GITHUB_REF_NAME}"
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          test -z "$(git status --porcelain)"

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Revalidate the release source
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --locked --all-targets --all-features -- -D warnings
          cargo +stable test --locked --all-targets --all-features
          cargo +stable test --locked --doc --all-features
          cargo +stable doc --locked --no-deps --all-features
          cargo +stable package --locked

      - name: Obtain a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish the tagged version
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +stable publish --locked
