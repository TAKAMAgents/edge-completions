name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal

      - name: Test all targets
        run: cargo +${{ matrix.rust }} test --locked --all-targets --all-features

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.86
        run: rustup toolchain install 1.86.0 --profile minimal

      - name: Check the published library dependency graph
        run: cargo +1.86.0 check --locked --lib

  quality:
    name: Formatting, lint, docs, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Run Clippy
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings

      - name: Build strict documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --no-deps --all-features

      - name: Build the crates.io package
        run: cargo +stable package --locked

  security:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install pinned policy tools
        run: |
          cargo +stable install --locked cargo-audit --version 0.22.1
          cargo +stable install --locked cargo-deny --version 0.19.4

      - name: Check advisories
        run: cargo +stable audit

      - name: Check licenses, sources, and bans
        run: cargo +stable deny check
