[package]
name = "edge-completions"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Typed Rust client for OpenAI-compatible chat completions through Cloudflare"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/TAKAMAgents/edge-completions"
homepage = "https://github.com/TAKAMAgents/edge-completions"
documentation = "https://docs.rs/edge-completions"
keywords = ["ai", "llm", "chat", "tool-calling", "cloudflare"]
categories = ["api-bindings", "asynchronous"]
publish = ["crates-io"]
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "docs/**/*.md",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    ".env.example",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
