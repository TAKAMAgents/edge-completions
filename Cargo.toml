[package]
name = "edge-completions"
version = "0.2.0"
edition = "2024"
rust-version = "1.86"
description = "Typed Rust SDK and CLI for OpenAI-compatible chat completions through Cloudflare"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/TAKAMAgents/edge-completions"
homepage = "https://github.com/TAKAMAgents/edge-completions"
documentation = "https://docs.rs/edge-completions"
keywords = ["ai", "llm", "chat", "tool-calling", "cloudflare"]
categories = ["api-bindings", "asynchronous", "command-line-utilities"]
publish = ["crates-io"]
default-run = "edge-completions"
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "docs/**/*.md",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    ".env.example",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
cli = ["dep:clap", "dep:tokio"]

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"], optional = true }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[[bin]]
name = "edge-completions"
path = "src/bin/edge-completions.rs"
required-features = ["cli"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
